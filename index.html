<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beauty Advent Calendars | 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181321;
      --panel: #241b30;
      --ink: #fff6f9;
      --muted: #ddcfe4;
      --pink: #ffb6d1;
      --gold: #ffe0a2;
      --line: #ffffff30;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 3% 3%, #6b284e 0, transparent 42%),
        radial-gradient(ellipse at 95% 85%, #403264 0, transparent 43%),
        var(--bg);
    }

    button, select { font: inherit; }
    a { color: var(--gold); text-underline-offset: .2em; }
    button, select {
      padding: .55rem .8rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: .65rem;
    }
    button:not(:disabled), select { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--pink); }
    button:disabled { opacity: .45; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

    .shell { width: min(1240px, 100%); margin: auto; padding: 1rem; }
    .top, .controls, .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .55rem .8rem;
    }
    .top { justify-content: space-between; margin-bottom: .7rem; }
    .top strong, .kicker {
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .8rem;
      color: var(--pink);
    }
    .meta { color: var(--muted); font-size: .85rem; }
    progress { width: 100%; height: .45rem; accent-color: var(--pink); display: block; }

    .slide {
      margin: .9rem 0;
      min-height: clamp(390px, 65vh, 730px);
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(1rem, 3vw, 3rem);
      padding: clamp(1.25rem, 4vw, 4rem);
      background: linear-gradient(135deg, #2b1f39, #21182a);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      box-shadow: 0 20px 55px #0004;
    }
    .slide.single { grid-template-columns: minmax(0, 1fr); }
    .content { min-width: 0; }
    h1 {
      margin: .35em 0 .45em;
      font-size: clamp(2rem, 4.6vw, 4.6rem);
      font-family: Georgia, serif;
      font-weight: normal;
      line-height: 1.05;
      overflow-wrap: break-word;
    }
    h2 { margin: 0 0 .55rem; font-size: 1.05rem; }
    .price {
      display: inline-block;
      margin: 0 0 .35rem;
      padding: .35rem .75rem;
      background: #ffe0a218;
      color: var(--gold);
      border: 1px solid #ffe0a255;
      border-radius: 999px;
      font-weight: 700;
    }
    .facts {
      margin: .85rem 0;
      padding-left: 1.2em;
      font-size: clamp(1.1rem, 2.05vw, 1.65rem);
      line-height: 1.45;
    }
    .facts li + li { margin-top: .35em; }
    .facts li::marker { color: var(--pink); }
    .question {
      font-size: clamp(1rem, 1.7vw, 1.4rem);
      border-left: 3px solid var(--pink);
      padding-left: .75rem;
      color: var(--muted);
    }
    figure { margin: 0; width: min(100%, 390px); justify-self: center; }
    .photo {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 4 / 5;
      max-height: 51vh;
      background: radial-gradient(circle at 30% 20%, #894767, #4d365e 65%, #32263f);
      border-radius: 1rem;
      overflow: hidden;
    }
    .photo img { position: absolute; width: 100%; height: 100%; object-fit: contain; background: #21182a; }
    .door {
      font: clamp(4rem, 12vw, 9rem) Georgia, serif;
      color: var(--gold);
      border: 1px solid #ffe0a275;
      border-radius: .7rem;
      padding: .08em .27em;
    }
    figcaption { margin-top: .5rem; text-align: center; color: var(--muted); font-size: .82rem; }
    .notes {
      padding: 1rem 1.2rem;
      margin-bottom: .9rem;
      border: 1px solid var(--line);
      border-radius: .9rem;
      background: var(--panel);
    }
    .notes p { max-width: 82ch; margin: .5rem 0; line-height: 1.6; }
    .cue, .small { color: var(--muted); font-size: .88rem; }
    [hidden] { display: none !important; }
    .controls select { flex: 1 1 180px; min-width: 0; }
    #next { background: var(--pink); color: #301829; font-weight: 700; }
    .small { margin-top: .85rem; }

    @media (max-width: 680px) {
      .slide { grid-template-columns: 1fr; min-height: 0; }
      figure { width: min(100%, 280px); }
      .photo { max-height: 36vh; }
      .top { align-items: flex-start; }
    }
  </style>
</head>

      <button id="next" type="button">Next →</button>
      <select id="jump" aria-label="Go to a slide"></select>
      <button id="toggleNotes" type="button" aria-controls="notes" aria-expanded="false">Speaker notes</button>
      <button id="full" type="button">Full screen</button>
    </nav>
    <p class="small">Keys: ← Back · → Next · N Speaker notes · F Full screen</p>
  </main>

    const get = id => document.getElementById(id);
    const slideEl = get("slide");
    const jump = get("jump");
    let index = 0;

    function node(tag, text, className) {
      const el = document.createElement(tag);
      if (text != null) el.textContent = text;
      if (className) el.className = className;
      return el;
    }

    function clock(seconds) {
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    let elapsed = 0;
    const startTimes = slides.map(slide => {
      const start = elapsed;
      elapsed += slide.seconds;
      return start;
    });

    slides.forEach((slide, i) => {
      const option = node("option", slide.label);
      option.value = String(i);
      jump.append(option);
    });

    function render() {
      const slide = slides[index];
      const content = node("div", null, "content");
      content.append(node("div", slide.kicker, "kicker"));

      const heading = node("h1", slide.title);
      heading.id = "title";
      content.append(heading);

      if (slide.price) content.append(node("p", `${slide.price} · US price in the article`, "price"));

      const list = node("ul", null, "facts");
      slide.facts.forEach(fact => list.append(node("li", fact)));
      content.append(list, node("p", slide.question, "question"));

      if (slide.source) {
        const credit = node("p", "Source: ", "small");
        const link = node("a", "Kara Nesvig’s 2026 beauty advent calendar guide · Teen Vogue");
        link.href = source;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        credit.append(link, ". Prices can change.");
        content.append(credit);
      }

      slideEl.classList.toggle("single", !slide.photo);
      slideEl.replaceChildren(content);

      if (slide.photo) {
        const figure = node("figure");
        const photo = node("div", null, "photo");
        const door = node("div", slide.number, "door");
        door.setAttribute("aria-hidden", "true");

        const image = node("img");
        image.alt = slide.price ? `Product photo: ${slide.title}` : "Beauty advent calendars from Teen Vogue";
        image.addEventListener("error", () => {
          image.remove();
          caption.textContent = "Product image not available offline.";
        }, { once: true });

        const caption = node("figcaption", "Image from Teen Vogue");
        photo.append(door, image);
        figure.append(photo, caption);
        slideEl.append(figure);
        image.src = slide.photo;
      }

      get("script").textContent = slide.speech;
      get("cue").textContent = slide.cue;
      get("position").textContent = `Slide ${index + 1} / ${slides.length}`;
      get("timing").textContent =
        `${clock(slide.seconds)} to speak · ${clock(startTimes[index])}–${clock(startTimes[index] + slide.seconds)}`;
      get("progress").max = slides.length;
      get("progress").value = index + 1;

      jump.value = String(index);
      get("prev").disabled = index === 0;
      get("next").disabled = index === slides.length - 1;
    }

    function go(to) {
      const target = Math.max(0, Math.min(slides.length - 1, to));
      if (index === target) return;
      index = target;
      render();
      window.scrollTo(0, 0);
    }

    function toggleNotes() {
      const notes = get("notes");
      notes.hidden = !notes.hidden;
      get("toggleNotes").setAttribute("aria-expanded", String(!notes.hidden));
    }

    async function toggleFull() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch {
        // Some browsers do not allow fullscreen for local files.
      }
    }

    get("prev").addEventListener("click", () => go(index - 1));
    get("next").addEventListener("click", () => go(index + 1));
    jump.addEventListener("change", () => go(Number(jump.value)));
    get("toggleNotes").addEventListener("click", toggleNotes);
    get("full").addEventListener("click", toggleFull);
    get("full").hidden = !document.fullscreenEnabled;

    document.addEventListener("fullscreenchange", () => {
      get("full").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
    });

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey ||
          event.target.closest("input, textarea, select, [contenteditable]")) return;

      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        go(index + (event.key === "ArrowRight" ? 1 : -1));
      } else if (event.key.toLowerCase() === "n") {
        toggleNotes();
      } else if (event.key.toLowerCase() === "f" && document.fullscreenEnabled) {
        toggleFull();
      }
    });

    render();
  </script>
</body>
</html>
